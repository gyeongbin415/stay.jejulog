<!doctype html>
<!--
  소라게 캐릭터 SVG 검수용 미리보기 — 개발 · 검수 전용.
  vite build 는 index.html 만 묶으므로 이 페이지는 웹진(dist)에 들어가지 않습니다.
  개발 서버에서: http://localhost:5181/dev/character-preview.html
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>소라게 SVG 검수</title>
<style>
  :root {
    --bg: #FAFAF3; --ink: #1C1B19; --soft: #6A6862; --line: #E3E1D6; --card: #FFFFFF; --accent: #D46A1F;
    --check-a: #EFEDE4; --check-b: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1B1A18; --ink: #F1EFE8; --soft: #A8A59C; --line: #34322E; --card: #24231F; --accent: #F39A52; --check-a: #2C2B27; --check-b: #24231F; }
  }
  :root[data-theme="dark"] { --bg: #1B1A18; --ink: #F1EFE8; --soft: #A8A59C; --line: #34322E; --card: #24231F; --accent: #F39A52; --check-a: #2C2B27; --check-b: #24231F; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
  h2 { font-size: 18px; margin: 40px 0 12px; }
  .note { color: var(--soft); margin: 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; margin-bottom: 10px; }
  .original { display: block; width: 100%; max-width: 900px; border-radius: 12px; border: 1px solid var(--line); }
  .zoom { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 12px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
  .zoom button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .zoom button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .zoom label { margin-left: auto; color: var(--soft); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .item { margin-top: 24px; padding: 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  .item header { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 12px; }
  .item header strong { font-size: 17px; }
  .item header code { color: var(--soft); font-size: 13px; }
  .pair { display: flex; flex-wrap: wrap; gap: 16px; }
  .pane { max-width: 100%; overflow-x: auto; }
  .pane { flex: none; }
  .pane p { margin: 0 0 6px; font-size: 12.5px; color: var(--soft); }
  .frame { position: relative; overflow: hidden; border-radius: 8px; border: 1px solid var(--line); }
  .frame.svg { background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 16px 16px; }
  .frame .crop { position: absolute; inset: 0; background: url(original.webp) no-repeat; }
  .frame img { display: block; width: 100%; height: 100%; }
  .frame.outline img { outline: 1px dashed var(--accent); outline-offset: -1px; }
</style>
</head>
<body>
<main>
  <span class="badge">개발 · 검수 전용</span>
  <h1>소라게 캐릭터 SVG 검수</h1>
  <p class="note">왼쪽은 원본 시안(래스터), 오른쪽은 제작한 SVG입니다. 두 쪽 모두 원본과 같은 축척이라 크기 · 위치를 바로 비교할 수 있습니다. 확대하면 원본은 흐려지고 SVG는 선명하게 유지됩니다.</p>

  <h2>원본 시안</h2>
  <img class="original" src="original.webp" alt="소라게 캐릭터 9종 원본 시안" />

  <div class="zoom" role="group" aria-label="확대 배율">
    <button type="button" data-z="1" aria-pressed="true">100%</button>
    <button type="button" data-z="2" aria-pressed="false">200%</button>
    <button type="button" data-z="4" aria-pressed="false">400%</button>
    <label><input type="checkbox" id="outline" /> SVG 틀 테두리 보기</label>
  </div>

  <div id="list"></div>
</main>
<script>
  // 원본 시안(1536 × 1024) 3 × 3 칸 — 글자 위까지만
  const COLS = [28, 529, 1030], TILE_W = 478, ROWS = [[12, 286], [358, 616], [690, 944]];
  const ITEMS = [
    ['cinema', 'hermit-shim.svg', '01 쉼 — 영화', '엔딩 크레딧까지 다 보게'],
    ['lp', 'hermit-seolon.svg', '02 서론 — LP', '이어폰은 잠시 넣어두게'],
    ['book', 'hermit-bookstay.svg', '03 서점숙소 — 독서', '오늘 밤만큼은 솔직하게'],
    ['craft', 'hermit-seureureu.svg', '04 스르르 — 나무반지', '걱정은 깎아서 흘려보내게'],
    ['flower', 'hermit-kokoko.svg', '05 코코코 — 꽃꽂이', '오늘은 나한테만 맞추게'],
    ['homemeal', 'hermit-susu.svg', '06 수수민박 — 집밥', '저녁은 같이 먹게'],
    ['wine', 'hermit-rooftop.svg', '07 루프탑정원 — 와인', '잔 좀 채워주게'],
    ['running', 'hermit-saeaewol.svg', '08 새애월 — 러닝', '한 바퀴만 더 달리게'],
    ['camping', 'hermit-mureung.svg', '09 무릉쉼표 — 스냅사진', '이 순간 그대로 남기게'],
  ];
  // 개발 서버(/dev/)에서는 실제 에셋 폴더를, 따로 올린 사본에서는 옆의 characters/ 를 씁니다
  const BASE = location.pathname.includes('/dev/') ? '../src/assets/characters/' : 'characters/';
  // SVG 틀(viewBox) 크기 — 파일에서 읽어 축척을 원본과 같게
  let VB = [335, 278];
  const list = document.getElementById('list');

  function render(z) {
    list.innerHTML = '';
    ITEMS.forEach(([id, file, title, line], i) => {
      const [y0, y1] = ROWS[(i / 3) | 0], x0 = COLS[i % 3], ch = y1 - y0;
      const el = document.createElement('section');
      el.className = 'item';
      el.innerHTML = `
        <header><strong>${title}</strong><span>${line}</span><code>${file}</code></header>
        <div class="pair">
          <div class="pane"><p>원본 (${z * 100}%)</p>
            <div class="frame" style="width:${TILE_W * z}px;height:${ch * z}px">
              <div class="crop" style="background-size:${1536 * z}px ${1024 * z}px;background-position:${-x0 * z}px ${-y0 * z}px"></div>
            </div></div>
          <div class="pane"><p>SVG (${z * 100}%)</p>
            <div class="frame svg" style="width:${VB[0] * z}px;height:${VB[1] * z}px">
              <img src="${BASE + file}" alt="${title} SVG" />
            </div></div>
        </div>`;
      list.appendChild(el);
    });
    document.querySelectorAll('.frame.svg').forEach((f) => f.classList.toggle('outline', document.getElementById('outline').checked));
  }

  fetch(BASE + ITEMS[0][1]).then((r) => r.text()).then((t) => {
    const m = t.match(/viewBox="([-\d.]+) ([-\d.]+) ([\d.]+) ([\d.]+)"/);
    if (m) VB = [Number(m[3]), Number(m[4])];
  }).catch(() => {}).finally(() => render(1));

  document.querySelectorAll('.zoom button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.zoom button').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
    render(Number(b.dataset.z));
  }));
  document.getElementById('outline').addEventListener('change', (e) => {
    document.querySelectorAll('.frame.svg').forEach((f) => f.classList.toggle('outline', e.target.checked));
  });
</script>
</body>
</html>
